<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sky Duel</title>
<style>
html,body{margin:0;height:100%;background:#0b1d33;overflow:hidden;touch-action:none;font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}
</style></head><body><canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');
let W,H;function rs(){W=c.width=innerWidth;H=c.height=innerHeight}rs();onresize=rs;
const PL=[
{n:'Falcon',d:'Balanced all-rounder',sp:3.2,tr:.06,hp:8,cd:12,ms:10,col:'#7ee0ff'},
{n:'Viper',d:'Fast, agile, fragile',sp:4.2,tr:.075,hp:6,cd:10,ms:8,col:'#b4ff7a'},
{n:'Titan',d:'Heavy armor, slow turns',sp:2.6,tr:.045,hp:14,cd:14,ms:14,col:'#ffcf6b'},
{n:'Ghost',d:'Rapid fire, light armor',sp:3.6,tr:.065,hp:7,cd:6,ms:8,col:'#d8a8ff'}];
const SPD=[['Relaxed',.32],['Normal',.5],['Fast',.75]];
let sel=0,spi=0,mode='menu',dt=.5,best=0;
let P,E,B,M,X,U,score,wave,clouds=[],mcd=0;
for(let i=0;i<14;i++)clouds.push({x:Math.random()*2000,y:Math.random()*1200,r:40+Math.random()*60});
const K={};let touch=null;
let rg=0,AC,mute=false,tm=0,ox=0,oy=0,bn='',bt=0;
function snd(t){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const S={g:[320,90,.07,'square'],m:[220,70,.3,'sawtooth'],x:[140,30,.4,'sawtooth'],p:[500,900,.15,'sine'],b:[100,20,1,'sawtooth']}[t],T=AC.currentTime,o=AC.createOscillator(),v=AC.createGain();o.type=S[3];o.frequency.setValueAtTime(S[0],T);o.frequency.exponentialRampToValueAtTime(S[1],T+S[2]);v.gain.setValueAtTime(t==='g'?.04:.09,T);v.gain.exponentialRampToValueAtTime(.001,T+S[2]);o.connect(v);v.connect(AC.destination);o.start(T);o.stop(T+S[2])}catch(e){}}
const mix=(a,b,t)=>Math.round(a+(b-a)*t);
const IS=[];for(let i=0;i<9;i++)IS.push({x:Math.random()*2000,y:Math.random()*1300,r:40+Math.random()*70,t:Array.from({length:6},()=>[Math.random()*2-1,Math.random()*2-1])});
onkeydown=e=>{const k=e.key.toLowerCase();K[k]=1;if(k==='n')mute=!mute;
 if(mode==='menu'){if(k==='arrowleft')sel=(sel+3)%4;if(k==='arrowright')sel=(sel+1)%4;
  if(k==='arrowup')spi=(spi+2)%3;if(k==='arrowdown')spi=(spi+1)%3;if(k==='enter'||k===' ')start()}
 else if(mode==='over'){if(k==='r')start();if(k==='enter'||k==='escape')mode='menu'}
 else if(k==='escape')mode='menu'};
onkeyup=e=>K[e.key.toLowerCase()]=0;
function mBtn(){return{x:W-70,y:H-80,r:42}}
function L(){const cols=W<640?2:4,rows=4/cols,gap=10;
 const cw=Math.min(200,(W-30-(cols-1)*gap)/cols),ch=Math.max(120,Math.min(180,(H-250)/rows-gap));
 const x0=(W-(cols*cw+(cols-1)*gap))/2,y0=64,cards=[];
 for(let i=0;i<4;i++)cards.push({x:x0+(i%cols)*(cw+gap),y:y0+Math.floor(i/cols)*(ch+gap),w:cw,h:ch});
 const sy=y0+rows*(ch+gap)+22,sw=Math.min(100,(W-40)/3-8),sx=W/2-(3*sw+16)/2;
 const sp=[0,1,2].map(i=>({x:sx+i*(sw+8),y:sy,w:sw,h:38}));
 return{cards,sp,go:{x:W/2-100,y:sy+54,w:200,h:48}}}
const inR=(r,x,y)=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;
c.addEventListener('pointerdown',e=>{const x=e.clientX,y=e.clientY;
 if(mode==='menu'){const l=L();l.cards.forEach((r,i)=>{if(inR(r,x,y))sel=i});l.sp.forEach((r,i)=>{if(inR(r,x,y))spi=i});if(inR(l.go,x,y))start();return}
 if(mode==='over'){mode='menu';return}
 const b=mBtn();if(Math.hypot(x-b.x,y-b.y)<b.r){missile(P);return}
 touch={x,y}});
c.addEventListener('pointermove',e=>{if(touch)touch={x:e.clientX,y:e.clientY}});
addEventListener('pointerup',()=>touch=null);
function jet(x,y,a,team,o){return Object.assign({x,y,a,cd:0,team},o)}
function start(){const p=PL[sel];dt=SPD[spi][1];
 P=jet(W/2,H/2,-Math.PI/2,0,{hp:p.hp,max:p.hp,sp:p.sp,tr:p.tr,cdv:p.cd,col:p.col,ms:p.ms,spr:[-.05,.05]});
 E=[];B=[];M=[];X=[];U=[];score=0;wave=0;mcd=0;mode='play';snd('p')}
function foe(k){const s=Math.random()<.5,h=3+Math.floor(wave/3),sp=2+Math.min(wave*.07,1);
 const T={grunt:{hp:h,sp,tr:.03,cdv:60,col:'#e8505b',pts:100,s:1},
 scout:{hp:2,sp:sp*1.6,tr:.05,cdv:90,col:'#ff9f43',pts:150,s:.8},
 heavy:{hp:h*2+4,sp:sp*.6,tr:.02,cdv:80,col:'#9b59b6',pts:250,s:1.5,spr:[-.25,0,.25]},
 boss:{hp:30+wave*3,sp:sp*.5,tr:.018,cdv:70,col:'#c0392b',pts:1000,s:2.6,spr:[-.5,-.25,0,.25,.5],boss:1}}[k];
 E.push(jet(s?-60:W+60,Math.random()*H,s?0:Math.PI,1,Object.assign({max:T.hp,kind:k},T)))}
function spawn(){wave++;bt=140;bn='Wave '+wave;
 if(wave%5===0){bn='BOSS INCOMING!';snd('b');foe('boss');foe('grunt');foe('grunt');return}
 const n=Math.min(1+Math.floor(wave*.7),6);
 for(let i=0;i<n;i++)foe(wave>=4&&i%4===3?'heavy':wave>=2&&i%3===2?'scout':'grunt')}
function shoot(j){if(j.cd>0)return;j.cd=j.cdv;if(!j.team)snd('g');const z=j.s||1;
 for(const o of j.spr||[0]){const a=j.a+o;B.push({x:j.x+Math.cos(j.a)*20*z,y:j.y+Math.sin(j.a)*20*z,vx:Math.cos(a)*(j.team?7:9),vy:Math.sin(a)*(j.team?7:9),l:70,t:j.team})}}
function missile(j){if(mcd>0||j.ms<=0||!E.length)return;j.ms--;mcd=14;snd('m');
 M.push({x:j.x,y:j.y,a:j.a,l:240,tg:null})}
function boom(x,y,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=1+Math.random()*4;X.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:30+Math.random()*20})}}
function diff(a,b){let d=b-a;while(d>Math.PI)d-=6.28318;while(d<-Math.PI)d+=6.28318;return d}
function wrap(j){j.x=(j.x+W)%W;j.y=(j.y+H)%H}
function hit(j,dmg){j.hp-=dmg;if(j.hp>0){if(j===P)snd('x');return}
 boom(j.x,j.y,j.boss?140:40);snd(j.boss?'b':'x');
 if(j===P){mode='over';best=Math.max(best,score)}else{score+=j.pts||100;
  if(j.boss)U.push({x:j.x-20,y:j.y,k:'h',l:900},{x:j.x+20,y:j.y,k:'m',l:900});
  else if(Math.random()<.45)U.push({x:j.x,y:j.y,k:Math.random()<.5?'h':'m',l:700})}}
function step(){
 tm+=dt;if(bt>0)bt-=dt;
 if(mode!=='play'){ox-=.3*dt;return}
 let fire=K[' '];
 if(touch){const d=diff(P.a,Math.atan2(touch.y-P.y,touch.x-P.x));P.a+=Math.max(-P.tr,Math.min(P.tr,d))*dt;fire=1}
 if(K.arrowleft||K.a)P.a-=P.tr*dt;if(K.arrowright||K.d)P.a+=P.tr*dt;
 if(K.m||K.x)missile(P);
 const sp=P.sp*((K.arrowup||K.w)?1.3:1)*dt;
 P.x+=Math.cos(P.a)*sp;P.y+=Math.sin(P.a)*sp;wrap(P);ox-=Math.cos(P.a)*sp*.5;oy-=Math.sin(P.a)*sp*.5;P.cd-=dt;rg+=dt;if(rg>400){rg=0;P.hp=Math.min(P.max,P.hp+1)}mcd-=dt;if(fire)shoot(P);
 for(const e of E){
  const d=diff(e.a,Math.atan2(P.y-e.y,P.x-e.x));
  e.a+=Math.max(-e.tr,Math.min(e.tr,d))*dt;
  e.x+=Math.cos(e.a)*e.sp*dt;e.y+=Math.sin(e.a)*e.sp*dt;wrap(e);e.cd-=dt;
  if(Math.abs(d)<(e.boss?.3:.15)&&Math.hypot(P.x-e.x,P.y-e.y)<(e.boss?460:380))shoot(e)}
 for(const b of B){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;
  for(const j of(b.t?[P]:E))if(b.l>0&&Math.hypot(j.x-b.x,j.y-b.y)<16*(j.s||1)){b.l=0;boom(b.x,b.y,5);hit(j,1)}}
 for(const m of M){
  if(!m.tg||m.tg.hp<=0){let bd=1e9;m.tg=null;for(const e of E){const d=Math.hypot(e.x-m.x,e.y-m.y);if(d<bd&&e.hp>0){bd=d;m.tg=e}}}
  if(m.tg)m.a+=Math.max(-.08,Math.min(.08,diff(m.a,Math.atan2(m.tg.y-m.y,m.tg.x-m.x))))*dt;
  m.x+=Math.cos(m.a)*5.5*dt;m.y+=Math.sin(m.a)*5.5*dt;m.l-=dt;
  X.push({x:m.x,y:m.y,vx:0,vy:0,l:10});
  for(const e of E)if(m.l>0&&e.hp>0&&Math.hypot(e.x-m.x,e.y-m.y)<20*e.s){m.l=0;boom(m.x,m.y,25);hit(e,4)}}
 for(const u of U){u.l-=dt;if(Math.hypot(u.x-P.x,u.y-P.y)<26){u.l=0;snd('p');if(u.k==='h')P.hp=Math.min(P.max,P.hp+3);else P.ms+=4}}
 B=B.filter(b=>b.l>0);M=M.filter(m=>m.l>0);E=E.filter(e=>e.hp>0);U=U.filter(u=>u.l>0);
 for(const x of X){x.x+=x.vx*dt;x.y+=x.vy*dt;x.l-=dt}X=X.filter(x=>x.l>0);
 if(!E.length&&mode==='play')spawn()}
function drawJet(j,col,s=1){
 g.save();g.translate(j.x,j.y);g.rotate(j.a);g.scale(s,s);g.fillStyle=col;
 g.beginPath();g.moveTo(22,0);g.lineTo(-14,-5);g.lineTo(-8,0);g.lineTo(-14,5);g.fill();
 g.beginPath();g.moveTo(4,0);g.lineTo(-12,-20);g.lineTo(-6,0);g.lineTo(-12,20);g.fill();
 g.fillStyle='#fff8';g.beginPath();g.arc(6,0,3,0,6.3);g.fill();g.restore()}
function sky(){const n=Math.max(0,Math.min(1,Math.sin(tm/1500)*1.6)),FW=W+500,FH=H+500;
 g.fillStyle=`rgb(${mix(22,6,n)},${mix(64,12,n)},${mix(107,34,n)})`;g.fillRect(0,0,W,H);
 const px=(x,k)=>((x+ox*k)%FW+FW)%FW-250,py=(y,k)=>((y+oy*k)%FH+FH)%FH-250;
 for(const q of IS){const x=px(q.x,1),y=py(q.y,1);
  g.fillStyle=`rgb(${mix(201,60,n)},${mix(178,56,n)},${mix(122,50,n)})`;g.beginPath();g.arc(x,y,q.r+9,0,6.3);g.fill();
  g.fillStyle=`rgb(${mix(63,14,n)},${mix(143,40,n)},${mix(78,24,n)})`;g.beginPath();g.arc(x,y,q.r,0,6.3);g.fill();
  g.fillStyle=`rgb(${mix(35,8,n)},${mix(100,26,n)},${mix(52,16,n)})`;
  for(const t of q.t){g.beginPath();g.arc(x+t[0]*q.r*.6,y+t[1]*q.r*.6,7,0,6.3);g.fill()}
  if(n>.2){g.fillStyle=`rgba(255,220,120,${n})`;for(const t of q.t.slice(0,3))g.fillRect(x+t[0]*q.r*.4,y+t[1]*q.r*.4,3,3)}}
 g.fillStyle=`rgba(255,255,255,${.12-n*.07})`;for(const q of clouds){g.beginPath();g.arc(px(q.x,1.7),py(q.y,1.7),q.r,0,6.3);g.fill()}}
function bar(x,y,w,v,col){g.fillStyle='#ffffff25';g.fillRect(x,y,w,6);g.fillStyle=col;g.fillRect(x,y,w*Math.max(.08,Math.min(1,v)),6)}
function menu(){
 sky();g.fillStyle='#fff';g.textAlign='center';g.font='bold 30px system-ui';g.fillText('SKY DUEL',W/2,44);
 const l=L();
 l.cards.forEach((r,i)=>{const p=PL[i],on=i===sel;
  g.fillStyle=on?'#ffffff30':'#ffffff12';g.fillRect(r.x,r.y,r.w,r.h);
  g.strokeStyle=on?p.col:'#ffffff30';g.lineWidth=on?3:1;g.strokeRect(r.x,r.y,r.w,r.h);
  drawJet({x:r.x+r.w/2,y:r.y+r.h*.26,a:-Math.PI/2},p.col,1.1);
  g.fillStyle='#fff';g.font='bold 16px system-ui';g.fillText(p.n,r.x+r.w/2,r.y+r.h*.5);
  g.font='11px system-ui';g.fillStyle='#fffc';g.fillText(p.d,r.x+r.w/2,r.y+r.h*.5+15);
  const bx=r.x+12,bw=r.w-24,by=r.y+r.h*.5+26,st=[p.sp/4.2,p.tr/.075,p.hp/14,(15-p.cd)/9];
  st.forEach((v,k)=>bar(bx,by+k*(r.h*.5-34)/4,bw,v,p.col))});
 g.font='13px system-ui';g.fillStyle='#fffc';g.fillText('Game speed',W/2,l.sp[0].y-8);
 l.sp.forEach((r,i)=>{const on=i===spi;g.fillStyle=on?'#ffffff35':'#ffffff12';g.fillRect(r.x,r.y,r.w,r.h);
  g.strokeStyle=on?'#fff':'#ffffff30';g.lineWidth=on?2:1;g.strokeRect(r.x,r.y,r.w,r.h);
  g.fillStyle='#fff';g.font='bold 14px system-ui';g.fillText(SPD[i][0],r.x+r.w/2,r.y+24)});
 const r=l.go;g.fillStyle='#ff9f43';g.fillRect(r.x,r.y,r.w,r.h);g.fillStyle='#1a1a1a';g.font='bold 20px system-ui';g.fillText('TAKE OFF',W/2,r.y+31);
 g.font='12px system-ui';g.fillStyle='#fff9';g.fillText('Bars: speed, turning, armor, fire rate  |  Best '+best,W/2,r.y+r.h+22);g.textAlign='left'}
function draw(){
 if(mode==='menu')return menu();
 sky();
 for(const u of U){g.fillStyle=u.k==='h'?'#4cd964':'#ff9f43';g.beginPath();g.arc(u.x,u.y,12,0,6.3);g.fill();g.fillStyle='#000';g.font='bold 13px system-ui';g.textAlign='center';g.fillText(u.k==='h'?'+':'M',u.x,u.y+5);g.textAlign='left'}
 for(const b of B){g.fillStyle=b.t?'#ff6b6b':'#ffe066';g.fillRect(b.x-2,b.y-2,4,4)}
 for(const m of M){g.fillStyle='#fff';g.fillRect(m.x-3,m.y-3,6,6)}
 for(const e of E){const z=e.s,w=28*z;drawJet(e,e.col,z);g.fillStyle='#0006';g.fillRect(e.x-w/2,e.y-22*z-8,w,4);g.fillStyle='#ff8080';g.fillRect(e.x-w/2,e.y-22*z-8,w*e.hp/e.max,4)}
 if(mode==='play')drawJet(P,P.col);
 for(const x of X){g.fillStyle=`rgba(255,${120+x.l*3},40,${Math.min(1,x.l/40)})`;g.fillRect(x.x,x.y,4,4)}
 g.fillStyle='#fff';g.font='bold 16px system-ui';g.fillText(`Score ${score}   Wave ${wave}   Missiles ${P.ms}`,16,28);
 g.fillStyle='#ffffff30';g.fillRect(16,38,120,8);g.fillStyle='#4cd964';g.fillRect(16,38,120*Math.max(0,P.hp)/P.max,8);
 if(touch!==undefined&&matchMedia('(pointer:coarse)').matches&&mode==='play'){const b=mBtn();g.fillStyle='#ff9f4388';g.beginPath();g.arc(b.x,b.y,b.r,0,6.3);g.fill();g.fillStyle='#fff';g.font='bold 14px system-ui';g.textAlign='center';g.fillText('MISSILE',b.x,b.y+5);g.textAlign='left'}
 if(bt>0&&mode==='play'){g.fillStyle=`rgba(255,255,255,${Math.min(1,bt/40)})`;g.font='bold 34px system-ui';g.textAlign='center';g.fillText(bn,W/2,90);g.textAlign='left'}
 if(mode==='over'){g.fillStyle='#0008';g.fillRect(0,0,W,H);g.fillStyle='#fff';g.textAlign='center';g.font='bold 36px system-ui';g.fillText('Shot down!',W/2,H/2-14);g.font='18px system-ui';g.fillText(`Score ${score}  |  Best ${best}`,W/2,H/2+16);g.fillText('R = retry, Enter or tap = plane select',W/2,H/2+44);g.textAlign='left'}
 else if(wave<=1&&score===0){g.font='13px system-ui';g.fillStyle='#fffc';g.fillText('Arrows/A-D turn, W boost, Space fire, M missile, N mute, Esc menu. Touch: drag to steer, auto-fire.',16,H-20)}}
function loop(){step();draw();requestAnimationFrame(loop)}
loop();
</script></body></html>
